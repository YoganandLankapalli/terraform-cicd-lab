
name: Terraform Plan and Approved Apply

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-lab10-state
  cancel-in-progress: false

jobs:
  terraform-plan:
    name: Generate Terraform Plan
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: infrastructure/lab10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/812569208126/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider
          service_account: github-terraform-plan@terraform-learning-lab-514407.iam.gserviceaccount.com

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -input=false -no-color -out=tfplan

      - name: Generate Readable Plan
        run: terraform show -no-color tfplan > plan.txt

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: |
            infrastructure/lab10/tfplan
            infrastructure/lab10/plan.txt
          retention-days: 1
          if-no-files-found: error


  terraform-apply:
    name: Approved Terraform Apply
    needs: terraform-plan
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: lab-apply

    defaults:
      run:
        working-directory: infrastructure/lab10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/812569208126/locations/global/workloadIdentityPools/github-actions-pool/providers/github-apply-provider
          service_account: github-terraform-apply@terraform-learning-lab-514407.iam.gserviceaccount.com

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init -input=false

      - name: Download Saved Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan
          path: infrastructure/lab10

      - name: Verify Saved Terraform Plan
        run: |
          test -s tfplan
          terraform show -no-color tfplan > /dev/null
          echo "Saved Terraform plan verified successfully."

      - name: Terraform Apply
        run: terraform apply -input=false tfplan
