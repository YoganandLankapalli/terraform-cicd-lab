
name: Terraform Approved Apply

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-lab10-state
  cancel-in-progress: false

jobs:
  terraform-apply:
    name: Approved Terraform Apply
    runs-on: ubuntu-latest

    environment: lab-apply

    defaults:
      run:
        working-directory: infrastructure/lab10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/812569208126/locations/global/workloadIdentityPools/github-actions-pool/providers/github-apply-provider
          service_account: github-terraform-apply@terraform-learning-lab-514407.iam.gserviceaccount.com

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -input=false -out=tfplan

      - name: Terraform Apply
        if: ${{ false }}
        run: terraform apply -input=false tfplan
